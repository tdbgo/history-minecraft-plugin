config-version: 1

storage:
  # sqlite or postgresql. Existing installations remain on SQLite.
  backend: sqlite
  # Direct player and server-event queue.
  queue-capacity: 50000
  # Applied FAWE chunks are admitted atomically when they fit. History never
  # blocks or partially applies the edit when this bounded capture lane is full.
  worldedit-queue-capacity: 131072
  # Normal transaction size. History scales this up to 8,192 records while a
  # lane is under sustained pressure, then returns to this low-latency size.
  batch-size: 512
  flush-interval-ms: 50
  # FAWE worker capture waits up to this long for bounded queue headroom.
  # Server-thread WorldEdit fallback capture remains strictly non-blocking.
  worldedit-admission-timeout-ms: 30000
  sqlite:
    file: history.db
    busy-timeout-ms: 5000
  postgresql:
    host: 127.0.0.1
    port: 5432
    database: history
    schema: history
    username: history
    # Prefer password-env in production so secrets are not stored in this file.
    password-env: HISTORY_PG_PASSWORD
    password: ''
    ssl-mode: require
    connect-timeout-ms: 5000
    socket-timeout-seconds: 30
  retention:
    # 0 keeps records indefinitely. Positive values purge in bounded batches and
    # reclaim state payloads once no retained change/operation references them.
    days: 0
    purge-batch-size: 10000
    maintenance-interval-minutes: 60

logging:
  player-blocks: true
  explosions: true
  natural-changes: true
  pistons: true
  liquids: true
  # Uses the public WorldEdit EditSession/Extent API and also supports FAWE.
  worldedit: true
  player-interactions: true
  containers: true
  signs: true
  player-sessions: true
  player-commands: true
  # Chat contains personal content, so it remains opt-in.
  player-messages: false
  items: true
  entities: true
  redacted-command-prefixes:
    - login
    - register
    - changepassword
    - 2fa
    - totp

inspection:
  result-limit: 8
  nearby-radius: 10

rollback:
  default-duration: 15m
  default-radius: 10
  # Legacy alpha options retained for config compatibility. History streams all
  # matching records and one exact chunk at a time, so these are not hard caps.
  max-radius: 10000
  max-source-changes: 10000
  max-chunks-per-operation: 256
  # Bounded pages limit memory, not the total restore size.
  planning-fetch-size: 2048
  operation-write-batch-size: 2048
  # No surrounding cuboid or WorldEdit/FAWE restore operation is requested.
  # Global pressure bound across simultaneous History operations. This limits
  # both in-flight loads and chunks currently held by a History ticket.
  max-concurrent-chunk-leases: 4
  chunk-load-timeout-seconds: 30
  # A recorded target normally already exists. If its region was pruned after
  # recording, allow Paper to regenerate that exact chunk before restoration.
  generate-missing-chunks: true
  blocks-per-tick: 250
  preview-ttl-seconds: 120
  # Must remain false. Startup rejects true until block-entity application,
  # item reconciliation, compensation, and recovery are atomic.
  restore-block-entity-data: false
